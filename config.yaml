# 通用模型生成参数
# - temperature：0~1，值越高生成越随机，越低越精准
# - top_p：0~1，采样阈值，与temperature二选一调优即可
# - max_tokens：生成文本的最大长度（需匹配模型支持的上限）
# - timeout：API请求超时时间（秒）
model_params:
  temperature: 0.7
  top_p: 0.8
  max_tokens: 2048
  timeout: 25

# RAG（检索增强生成）配置（后续开发用）
# - vector_db_path：向量数据库本地存储路径
# - embedding_model：文本嵌入模型（建议使用开源中文模型）
# - rag_top_k：检索返回的最相关top-k条知识库内容
# - knowledge_base_path：知识库文件存储路径
rag:
  vector_db_path: "./data/energy_vector_db"
  embedding_model: "BAAI/bge-small-zh-v1.5"
  rag_top_k: 5
  knowledge_base_path: "./data/energy_knowledge"

