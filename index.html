<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>能源管理智能问答系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ═══════════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════════ */
:root {
  --bg:         #ffffff;
  --bg2:        #f7f8fa;
  --bg3:        #eef0f4;
  --surface:    #f0f2f5;
  --surface2:   #e8ebf0;
  --border:     rgba(0,0,0,0.08);
  --border2:    rgba(0,0,0,0.14);
  --accent:     #007a63;
  --accent2:    #0066cc;
  --accent3:    #d44f1a;
  --text:       #111318;
  --text2:      #4a5568;
  --text3:      #8a96aa;
  --user-bubble:#e8f2ff;
  --ai-bubble:  #f0faf7;
  --danger:     #d63031;
  --warn:       #e17c00;
  --radius:     14px;
  --radius-sm:  8px;
  --shadow:     0 4px 20px rgba(0,0,0,0.10);
  --shadow-sm:  0 2px 8px rgba(0,0,0,0.07);
  --font-head:  'Syne', sans-serif;
  --font-body:  'DM Sans', sans-serif;
  --font-mono:  'JetBrains Mono', monospace;
  --sidebar-w:  280px;
  --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
}

/* ═══════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d0d5de; border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: #b0b8c8; }
button { cursor: pointer; border: none; background: none; font-family: inherit; }
input, textarea { font-family: inherit; }
a { color: inherit; text-decoration: none; }

/* ═══════════════════════════════════════════════════
   LAYOUT SHELL
═══════════════════════════════════════════════════ */
.shell {
  display: flex;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* ═══════════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════════ */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  z-index: 10;
}

.sidebar-header {
  padding: 20px 18px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.logo-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
}
.logo-text {
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
  line-height: 1.3;
  color: var(--text);
}
.logo-text span { color: var(--accent); }

.btn-new-chat {
  width: 100%;
  padding: 10px 14px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.04em;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; gap: 8px;
  transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
  box-shadow: 0 4px 14px rgba(0,102,204,0.18);
}
.btn-new-chat:hover {
  opacity: 0.9;
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(0,102,204,0.25);
}
.btn-new-chat:active { transform: translateY(0); }

.sidebar-section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #9aa3b0;
  padding: 14px 18px 6px;
  flex-shrink: 0;
}

.sessions-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 10px 10px;
}
.session-item {
  padding: 10px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background var(--transition);
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.session-item:hover { background: var(--surface); }
.session-item.active {
  background: #e6f4ff;
  border-left: 2px solid var(--accent2);
  padding-left: 8px;
}
.session-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text3);
  flex-shrink: 0;
  transition: background var(--transition);
}
.session-item.active .session-dot { background: var(--accent2); }
.session-info { min-width: 0; flex: 1; }

.btn-delete-session {
  flex-shrink: 0;
  width: 24px; height: 24px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--text3);
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity var(--transition), background var(--transition), color var(--transition);
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
}
.session-item:hover .btn-delete-session { opacity: 1; }
.btn-delete-session:hover { background: rgba(255,71,87,0.15); color: var(--danger); }
.session-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.session-item.active .session-title { color: var(--accent2); }
.session-meta {
  font-size: 11px;
  color: var(--text3);
  margin-top: 1px;
}

.sidebar-footer {
  display: none;
}

/* ═══════════════════════════════════════════════════
   MAIN CONTENT
═══════════════════════════════════════════════════ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  position: relative;
}

/* Top bar */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
  z-index: 5;
}
.btn-toggle-sidebar {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  color: var(--text2);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  transition: background var(--transition), color var(--transition);
}
.btn-toggle-sidebar:hover { background: var(--surface); color: var(--text); }

.topbar-title {
  font-family: var(--font-head);
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar-badge {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  padding: 3px 9px;
  border-radius: 99px;
  background: rgba(0,102,204,0.08);
  color: var(--accent2);
  border: 1px solid rgba(0,102,204,0.18);
}
.btn-stats {
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  color: var(--text2);
  border: 1px solid var(--border2);
  transition: all var(--transition);
  display: flex; align-items: center; gap: 5px;
}
.btn-stats:hover { background: var(--surface); color: var(--text); border-color: var(--border2); }

/* ═══════════════════════════════════════════════════
   CHAT AREA
═══════════════════════════════════════════════════ */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 32px 0;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* Welcome screen — takes full space, input overlaid in center */
.welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 80px 24px 0;
  animation: fadeUp 0.5s ease both;
}
.welcome-title {
  font-family: var(--font-head);
  font-size: 42px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 0;
  text-align: center;
}
.welcome-title span {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.welcome-sub {
  font-size: 15px;
  color: var(--text2);
  text-align: center;
  max-width: 400px;
  line-height: 1.7;
  margin-bottom: 36px;
}
.suggestions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-width: 560px;
  width: 100%;
}
.suggestion-card {
  background: #fff;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 14px 16px;
  cursor: pointer;
  transition: all var(--transition);
  text-align: left;
  box-shadow: var(--shadow-sm);
}
.suggestion-card:hover {
  background: #f5faff;
  border-color: var(--accent2);
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(0,102,204,0.12);
}
.suggestion-card:hover .suggestion-arrow { opacity: 1; transform: translateX(2px); }
.suggestion-icon { font-size: 20px; margin-bottom: 6px; }
.suggestion-text {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.5;
}
.suggestion-arrow {
  display: inline-block;
  margin-top: 6px;
  font-size: 12px;
  color: var(--accent2);
  opacity: 0;
  transition: all var(--transition);
}

/* Messages */
.message-group {
  padding: 6px 24px;
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
  animation: fadeUp 0.3s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.message-row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-bottom: 18px;
}
.message-row.user { flex-direction: row-reverse; }

.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  margin-top: 2px;
}
.avatar.user-av {
  background: linear-gradient(135deg, var(--accent2), #6c5ce7);
  color: #fff;
  font-weight: 700;
  font-size: 12px;
  font-family: var(--font-head);
}
.avatar.ai-av {
  background: none;
  border-radius: 50%;
  overflow: hidden;
  font-size: 0;
  padding: 0;
}
.avatar.ai-av img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  display: block;
}

.bubble-wrap { flex: 1; min-width: 0; }

.bubble {
  padding: 12px 16px;
  border-radius: var(--radius);
  line-height: 1.75;
  font-size: 14.5px;
  position: relative;
  word-break: break-word;
}
.bubble.user {
  background: var(--user-bubble);
  border: 1px solid rgba(0,102,204,0.18);
  border-top-right-radius: 4px;
  color: var(--text);
  margin-left: 40px;
}
.bubble.ai {
  background: var(--ai-bubble);
  border: 1px solid rgba(0,122,99,0.15);
  border-top-left-radius: 4px;
  color: var(--text);
  margin-right: 40px;
}

/* Markdown-like content in AI bubble */
.bubble.ai h1, .bubble.ai h2, .bubble.ai h3 {
  font-family: var(--font-head);
  font-weight: 700;
  margin: 16px 0 8px;
  color: var(--text);
}
.bubble.ai h1 { font-size: 17px; color: var(--accent); }
.bubble.ai h2 { font-size: 15px; color: var(--accent2); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.bubble.ai h3 { font-size: 14px; }
.bubble.ai p { margin: 8px 0; }
.bubble.ai ul, .bubble.ai ol { padding-left: 20px; margin: 8px 0; }
.bubble.ai li { margin: 4px 0; }
.bubble.ai strong { color: var(--text); font-weight: 600; }
.bubble.ai em { color: var(--text2); font-style: italic; }
.bubble.ai code {
  background: rgba(0,102,204,0.07);
  color: var(--accent2);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 13px;
}
.bubble.ai pre {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  overflow-x: auto;
  margin: 10px 0;
}
.bubble.ai pre code { background: none; padding: 0; color: var(--text2); }
.bubble.ai blockquote {
  border-left: 3px solid var(--accent2);
  padding-left: 12px;
  margin: 10px 0;
  color: var(--text2);
  font-style: italic;
}
.bubble.ai hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

.bubble-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.meta-time {
  font-size: 11px;
  color: var(--text3);
}
.meta-elapsed {
  font-size: 11px;
  color: var(--text3);
  font-family: var(--font-mono);
}
.meta-source-tag {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 99px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.tag-rag { background: rgba(0,122,99,0.08); color: var(--accent); border: 1px solid rgba(0,122,99,0.18); }
.tag-web { background: rgba(0,102,204,0.08); color: var(--accent2); border: 1px solid rgba(0,102,204,0.18); }
.tag-general { background: rgba(0,0,0,0.04); color: var(--text3); border: 1px solid var(--border2); }

/* Sources */
.sources-section {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.sources-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 6px;
}
.source-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(0,122,99,0.07);
  border: 1px solid rgba(0,122,99,0.18);
  border-radius: 99px;
  padding: 3px 10px;
  font-size: 11px;
  color: var(--accent);
  margin: 2px 3px 2px 0;
  font-family: var(--font-mono);
}

/* Subtask pills */
.subtasks-section {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.subtasks-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
}
.subtasks-title:hover { color: var(--text2); }
.subtasks-toggle {
  font-size: 10px;
  transition: transform var(--transition);
}
.subtasks-toggle.open { transform: rotate(90deg); }
.subtasks-list { display: none; }
.subtasks-list.open { display: flex; flex-wrap: wrap; gap: 5px; }
.subtask-pill {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 99px;
  display: flex; align-items: center; gap: 4px;
}
.subtask-pill.success { background: rgba(0,122,99,0.08); color: var(--accent); border: 1px solid rgba(0,122,99,0.2); }
.subtask-pill.error   { background: rgba(214,48,49,0.08); color: var(--danger); border: 1px solid rgba(214,48,49,0.2); }
.subtask-pill.timeout { background: rgba(225,124,0,0.08); color: var(--warn);   border: 1px solid rgba(225,124,0,0.2); }

/* Rating */
.rating-section {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.rating-label { font-size: 11px; color: var(--text3); }
.btn-rate {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  border: 1px solid var(--border);
  transition: all var(--transition);
  color: var(--text3);
}
.btn-rate:hover { border-color: var(--border2); background: var(--surface); color: var(--text); transform: scale(1.1); }
.btn-rate.liked   { background: rgba(0,122,99,0.1); border-color: var(--accent); color: var(--accent); }
.btn-rate.disliked { background: rgba(214,48,49,0.1); border-color: var(--danger); color: var(--danger); }
.rating-done {
  font-size: 11px;
  color: var(--text3);
  font-style: italic;
  display: none;
}

/* Thinking animation */
.thinking {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 12px 16px;
  background: var(--ai-bubble);
  border: 1px solid rgba(0,122,99,0.15);
  border-radius: var(--radius);
  border-top-left-radius: 4px;
  margin-right: 40px;
  width: fit-content;
}
.thinking-text {
  font-size: 13px;
  color: var(--text3);
  font-style: italic;
}
.thinking-dots { display: none; }
.thinking-dot { display: none; }
@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
  40%           { opacity: 1;   transform: scale(1); }
}

/* Step progress */
.step-progress {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-size: 12px;
  color: var(--text3);
}
.step-item {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: 99px;
  border: 1px solid var(--border);
  transition: all 0.4s ease;
}
.step-item.active { border-color: var(--accent2); color: var(--accent2); background: rgba(0,102,204,0.07); }
.step-item.done   { border-color: var(--text3); color: var(--text3); opacity: 0.6; }
.step-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.step-arrow { color: var(--text3); font-size: 10px; }

/* ═══════════════════════════════════════════════════
   INPUT AREA
═══════════════════════════════════════════════════ */

/* Wrapper that holds the chat area + input together */
.content-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Welcome state: input floats near top, below the title */
.content-wrap.welcome-mode .chat-area {
  overflow: hidden;
}
.content-wrap.welcome-mode .input-area {
  position: absolute;
  left: 0; right: 0;
  top: 200px;
  border-top: none;
  background: transparent;
  z-index: 2;
}

/* Chat state: input sits at the bottom normally */
.content-wrap.chat-mode .input-area {
  position: static;
  transform: none;
  border-top: 1px solid var(--border);
  background: var(--bg);
}

.input-area {
  flex-shrink: 0;
  padding: 16px 24px 20px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: none;
}
.input-inner {
  width: 100%;
  max-width: 680px;
}
.input-box {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--surface);
  border: 1.5px solid var(--border2);
  border-radius: var(--radius);
  padding: 10px 12px;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.input-box:focus-within {
  border-color: var(--accent2);
  box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
}
.input-box.disabled {
  opacity: 0.6;
  pointer-events: none;
}
#question-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 14.5px;
  line-height: 1.6;
  resize: none;
  max-height: 150px;
  min-height: 24px;
  padding: 2px 0;
}
#question-input::placeholder { color: var(--text3); }

.btn-send {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
  box-shadow: 0 2px 8px rgba(0,102,204,0.25);
}
.btn-send:hover { opacity: 0.9; transform: scale(1.05); }
.btn-send:active { transform: scale(0.97); }
.btn-send:disabled { opacity: 0.4; transform: none; cursor: not-allowed; }

.input-hint {
  margin-top: 7px;
  font-size: 11px;
  color: var(--text3);
  text-align: center;
}
.input-hint kbd {
  background: var(--surface2);
  border: 1px solid var(--border2);
  padding: 1px 5px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 10px;
}

/* ═══════════════════════════════════════════════════
   STATS MODAL
═══════════════════════════════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: #fff;
  border: 1px solid var(--border2);
  border-radius: 18px;
  width: 500px;
  max-width: 92vw;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,0.14);
  transform: translateY(20px) scale(0.97);
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
}
.modal-title {
  font-family: var(--font-head);
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
}
.btn-close-modal {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--surface);
  color: var(--text2);
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: background var(--transition), color var(--transition);
}
.btn-close-modal:hover { background: var(--surface2); color: var(--text); }
.modal-body { padding: 20px 24px; }
.stats-big-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.stats-big-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}
.stats-big-val {
  font-family: 'SimSun', '宋体', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--accent2);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stats-big-label {
  font-size: 11px;
  color: var(--text3);
  margin-top: 5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.rating-bar-wrap {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.rating-bar-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 12px;
  letter-spacing: 0.04em;
}
.rating-bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.rating-bar-label { font-size: 12px; color: var(--text2); width: 40px; }
.rating-bar-track {
  flex: 1;
  height: 8px;
  background: var(--surface2);
  border-radius: 99px;
  overflow: hidden;
}
.rating-bar-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
}
.rating-bar-fill.like { background: linear-gradient(90deg, var(--accent), #009e7f); }
.rating-bar-fill.dislike { background: linear-gradient(90deg, var(--danger), #e05555); }
.rating-bar-count { font-size: 12px; color: var(--text3); width: 30px; text-align: right; }

/* ═══════════════════════════════════════════════════
   FEEDBACK MODAL
═══════════════════════════════════════════════════ */
.feedback-modal {
  background: #fff;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 18px 20px;
  width: 320px;
  max-width: 90vw;
  box-shadow: 0 8px 40px rgba(0,0,0,0.14);
  transform: translateY(20px) scale(0.97);
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
}
.modal-overlay.open .feedback-modal { transform: translateY(0) scale(1); }
.feedback-title {
  font-family: var(--font-head);
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--text);
}
#feedback-textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 13px;
  padding: 10px 12px;
  resize: none;
  height: 80px;
  outline: none;
  transition: border-color var(--transition);
}
#feedback-textarea:focus { border-color: var(--accent2); }
.feedback-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  justify-content: flex-end;
}
.btn-feedback-skip {
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  transition: all var(--transition);
}
.btn-feedback-skip:hover { background: var(--surface); color: var(--text2); }
.btn-feedback-submit {
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 600;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  border-radius: var(--radius-sm);
  transition: opacity var(--transition);
}
.btn-feedback-submit:hover { opacity: 0.9; }

/* ═══════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════ */
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 200;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: #fff;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  font-size: 13px;
  color: var(--text);
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  animation: toastIn 0.3s ease both, toastOut 0.3s ease 2.7s both;
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.success { border-left: 3px solid var(--accent); }
.toast.error   { border-left: 3px solid var(--danger); }
@keyframes toastIn  { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
@keyframes toastOut { from { opacity:1; } to { opacity:0; transform: translateY(-5px); } }

/* ═══════════════════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════════════ */
@media (max-width: 640px) {
  .sidebar { position: absolute; top: 0; left: 0; height: 100%; z-index: 20; }
  .sidebar.collapsed { transform: translateX(-100%); width: var(--sidebar-w); min-width: var(--sidebar-w); }
  .suggestions { grid-template-columns: 1fr; }
  .stats-big-grid { grid-template-columns: 1fr 1fr; }
  .message-group { padding: 6px 16px; }
  .input-area { padding: 12px 16px 16px; }
}

/* Subtle dot pattern for light bg */
.main::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(0,0,0,0.045) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
  z-index: 0;
}
.chat-area, .input-area, .topbar { position: relative; z-index: 1; }
</style>
</head>
<body>

<!-- ═══════════════════════ SHELL ═══════════════════════ -->
<div class="shell">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon"><img src="/avatar.jpg" alt="logo" style="width:100%;height:100%;object-fit:cover;border-radius:8px;display:block;"></div>
        <div class="logo-text">能源问答<br><span>智能系统</span></div>
      </div>
      <button class="btn-new-chat" id="btn-new-chat" onclick="newChat()">
        <span>✦</span> 新建对话
      </button>
    </div>

    <div class="sidebar-section-title">历史会话</div>
    <div class="sessions-list" id="sessions-list">
      <!-- populated by JS -->
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main" id="main">
    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-title" id="topbar-title">能源管理智能问答</div>
      <div class="topbar-badge">AI · RAG</div>
      <button class="btn-stats" onclick="openStatsModal()">📊 统计</button>
    </header>

    <!-- CONTENT WRAP -->
    <div class="content-wrap welcome-mode" id="content-wrap">

    <!-- CHAT AREA -->
    <div class="chat-area" id="chat-area">
      <!-- Welcome screen -->
      <div class="welcome" id="welcome-screen">
        <div class="welcome-title">能源管理<span>智能问答</span></div>
      </div>
    </div>

    <!-- INPUT AREA -->
    <div class="input-area">
      <div class="input-inner">
        <div class="input-box" id="input-box">
          <textarea
            id="question-input"
            placeholder="请输入您的能源领域问题..."
            rows="1"
            onkeydown="handleKey(event)"
            oninput="autoResize(this)"
          ></textarea>
          <button class="btn-send" id="btn-send" onclick="sendQuestion()" title="发送 (Enter)">
            ➤
          </button>
        </div>
        <div class="input-hint">按 <kbd>Enter</kbd> 发送 · <kbd>Shift+Enter</kbd> 换行</div>
      </div>
    </div>

    </div><!-- end content-wrap -->
  </div>
</div>

<!-- ═══════════════════ STATS MODAL ═══════════════════ -->
<div class="modal-overlay" id="stats-modal-overlay" onclick="closeStatsModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">📊 系统使用统计</div>
      <button class="btn-close-modal" onclick="closeStatsModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="stats-big-grid" id="stats-big-grid">
        <div class="stats-big-card"><div class="stats-big-val" id="m-sessions">—</div><div class="stats-big-label">总会话</div></div>
        <div class="stats-big-card"><div class="stats-big-val" id="m-questions">—</div><div class="stats-big-label">总提问</div></div>
        <div class="stats-big-card"><div class="stats-big-val" id="m-rt">—</div><div class="stats-big-label">均响应(s)</div></div>
      </div>
      <div class="rating-bar-wrap">
        <div class="rating-bar-title">用户评价分布</div>
        <div class="rating-bar-row">
          <div class="rating-bar-label">👍 赞</div>
          <div class="rating-bar-track"><div class="rating-bar-fill like" id="bar-like" style="width:0%"></div></div>
          <div class="rating-bar-count" id="bar-like-count">0</div>
        </div>
        <div class="rating-bar-row">
          <div class="rating-bar-label">👎 踩</div>
          <div class="rating-bar-track"><div class="rating-bar-fill dislike" id="bar-dislike" style="width:0%"></div></div>
          <div class="rating-bar-count" id="bar-dislike-count">0</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════ FEEDBACK MODAL ═══════════════════ -->
<div class="modal-overlay" id="feedback-modal-overlay">
  <div class="feedback-modal" onclick="event.stopPropagation()">
    <div class="feedback-title" id="feedback-modal-title">💬 添加反馈（可选）</div>
    <textarea id="feedback-textarea" placeholder="请输入您的具体意见或建议..."></textarea>
    <div class="feedback-actions">
      <button class="btn-feedback-skip" onclick="submitFeedback(false)">跳过</button>
      <button class="btn-feedback-submit" onclick="submitFeedback(true)">提交反馈</button>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<script>
// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
const state = {
  sessionId: null,
  sessionTitle: '新对话',
  loading: false,
  sidebarOpen: true,
  pendingRating: null,   // { messageId, ratingVal }
};

const API = '';  // same origin

// ═══════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  await loadSessions();
  await loadStats();
  // Auto-create first session
  await newChat(true);
});

// ═══════════════════════════════════════════════════════════════════
// SESSION MANAGEMENT
// ═══════════════════════════════════════════════════════════════════
async function newChat(silent = false) {
  try {
    const res = await fetch(`${API}/api/sessions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: '新对话' }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    state.sessionId = data.session_id;
    state.sessionTitle = '新对话';
    updateTopbarTitle('新对话');
    clearChatArea();
    showWelcome();
    await loadSessions();
    if (!silent) toast('✨ 新会话已创建', 'success');
  } catch (e) {
    toast('创建会话失败：' + e.message, 'error');
  }
}

async function loadSessions() {
  try {
    const res = await fetch(`${API}/api/sessions?limit=40`);
    const data = await res.json();
    if (!data.ok) return;
    renderSessions(data.sessions);
  } catch {}
}

function renderSessions(sessions) {
  const el = document.getElementById('sessions-list');
  if (!sessions.length) {
    el.innerHTML = '<div style="padding:10px 10px;font-size:12px;color:var(--text3)">暂无历史会话</div>';
    return;
  }
  el.innerHTML = '';
  sessions.forEach(s => {
    const item = document.createElement('div');
    item.className = 'session-item' + (s.id === state.sessionId ? ' active' : '');
    item.innerHTML =
      '<div class="session-dot"></div>' +
      '<div class="session-info">' +
        '<div class="session-title">' + escHtml(s.title) + '</div>' +
        '<div class="session-meta">' + s.message_count + ' 条消息 · ' + formatDate(s.updated_at) + '</div>' +
      '</div>' +
      '<button class="btn-delete-session" title="删除会话">🗑</button>';
    item.addEventListener('click', function(e) {
      if (e.target.classList.contains('btn-delete-session')) {
        e.stopPropagation();
        confirmDeleteSession(s.id, s.title);
        return;
      }
      loadSession(s.id, s.title);
    });
    el.appendChild(item);
  });
}

async function loadSession(sessionId, title) {
  if (state.loading) return;
  if (state.sessionId === sessionId) return; // already active

  state.sessionId = sessionId;
  state.sessionTitle = title;
  updateTopbarTitle(title);
  clearChatArea();

  // Mark active in sidebar immediately
  document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.session-item').forEach(el => {
    if (el.querySelector('.session-title') &&
        el.querySelector('.session-title').textContent === title) {
      el.classList.add('active');
    }
  });

  try {
    const res = await fetch(API + '/api/sessions/' + sessionId + '/messages');
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);

    if (!data.messages || data.messages.length === 0) {
      showWelcome();
    } else {
      hideWelcome();
      const chatArea = document.getElementById('chat-area');
      for (const msg of data.messages) {
        if (msg.role === 'user') {
          appendUserBubble(msg.content, msg.created_at);
        } else {
          const sources = Array.isArray(msg.rag_sources) ? msg.rag_sources : [];
          appendAIBubble(msg.content, {
            messageId: msg.id,
            ragSources: sources,
            elapsed: msg.elapsed_seconds,
            subtasks: [],
            fromHistory: true,
          });
        }
      }
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    await loadSessions(); // refresh sidebar to show active state
  } catch (e) {
    toast('加载会话失败：' + e.message, 'error');
  }
}

// ═══════════════════════════════════════════════════════════════════
// QUESTION SENDING
// ═══════════════════════════════════════════════════════════════════
async function sendQuestion() {
  if (state.loading) return;

  const input = document.getElementById('question-input');
  const question = input.value.trim();
  if (!question) return;
  if (!state.sessionId) { toast('请先创建或选择一个会话', 'error'); return; }

  hideWelcome();
  input.value = '';
  autoResize(input);
  setLoading(true);

  appendUserBubble(question);

  const thinkingId = appendThinking();

  try {
    const res = await fetch(`${API}/api/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: state.sessionId, question }),
    });
    const data = await res.json();

    removeThinking(thinkingId);

    if (!data.ok) throw new Error(data.error);

    appendAIBubble(data.answer, {
      messageId: data.assistant_message_id,
      ragSources: data.rag_sources || [],
      elapsed: data.elapsed_seconds,
      subtasks: data.subtask_results || [],
      fromHistory: false,
    });

    // Update session title from first question
    if (state.sessionTitle === '新对话') {
      state.sessionTitle = question.slice(0, 20) + (question.length > 20 ? '…' : '');
      updateTopbarTitle(state.sessionTitle);
    }

    await loadSessions();
    await loadStats();

  } catch (e) {
    removeThinking(thinkingId);
    appendErrorBubble(e.message);
  } finally {
    setLoading(false);
  }
}

// ═══════════════════════════════════════════════════════════════════
// CHAT RENDERING
// ═══════════════════════════════════════════════════════════════════
function appendUserBubble(text, time) {
  const chatArea = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'message-group';
  div.innerHTML = `
    <div class="message-row user">
      <div class="avatar user-av">您</div>
      <div class="bubble-wrap">
        <div class="bubble user">${escHtml(text)}</div>
        <div class="bubble-meta">
          <span class="meta-time">${time ? formatDate(time) : now()}</span>
        </div>
      </div>
    </div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function appendAIBubble(text, { messageId, ragSources, elapsed, subtasks, fromHistory }) {
  const chatArea = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'message-group';

  // Source tags from subtasks
  const ksSummary = summarizeKS(subtasks);
  const sourceTags = ksSummary.map(ks => {
    if (ks === 'rag')     return `<span class="meta-source-tag tag-rag"> 知识库</span>`;
    if (ks === 'web')     return `<span class="meta-source-tag tag-web"> 网络</span>`;
    return `<span class="meta-source-tag tag-general"> 通用知识</span>`;
  }).join('');

  // RAG source chips
  const sourcesHtml = ragSources.length ? `
    <div class="sources-section">
      <div class="sources-title"> 引用知识库文件</div>
      ${ragSources.map(s => `<span class="source-chip">📄 ${escHtml(s)}</span>`).join('')}
    </div>` : '';

  // Subtasks
  const stId = 'st-' + Date.now();
  const subtasksHtml = subtasks.length ? `
    <div class="subtasks-section">
      <div class="subtasks-title" onclick="toggleSubtasks('${stId}')">
        <span class="subtasks-toggle" id="toggle-${stId}">▶</span>
        推理子任务 (${subtasks.length})
      </div>
      <div class="subtasks-list" id="${stId}">
        ${subtasks.map(s => `
          <span class="subtask-pill ${s.status}">
            ${s.status === 'success' ? '✓' : s.status === 'timeout' ? '⏰' : '✗'}
            ${escHtml(s.focus)}
          </span>`).join('')}
      </div>
    </div>` : '';

  // Rating (only for fresh responses)
  const ratingId = 'rating-' + messageId;
  const ratingHtml = messageId && !fromHistory ? `
    <div class="rating-section" id="${ratingId}">
      <span class="rating-label">这个回答对您有帮助吗？</span>
      <button class="btn-rate" id="like-${messageId}" onclick="handleRate(${messageId}, 1)" title="有帮助">👍</button>
      <button class="btn-rate" id="dislike-${messageId}" onclick="handleRate(${messageId}, -1)" title="需改进">👎</button>
      <span class="rating-done" id="rated-${messageId}">已记录感谢 ✓</span>
    </div>` : '';

  div.innerHTML = `
    <div class="message-row">
      <div class="avatar ai-av"><img src="/avatar.jpg" alt="AI"></div>
      <div class="bubble-wrap">
        <div class="bubble ai">${renderMarkdown(text)}</div>
        <div class="bubble-meta">
          <span class="meta-time">${now()}</span>
          ${elapsed ? `<span class="meta-elapsed">⏱ ${elapsed}s</span>` : ''}
          ${sourceTags}
        </div>
        ${sourcesHtml}
        ${subtasksHtml}
        ${ratingHtml}
      </div>
    </div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function appendErrorBubble(msg) {
  const chatArea = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'message-group';
  div.innerHTML = `
    <div class="message-row">
      <div class="avatar ai-av"><img src="/avatar.jpg" alt="AI"></div>
      <div class="bubble-wrap">
        <div class="bubble ai" style="border-color:rgba(255,71,87,0.25);background:rgba(255,71,87,0.05)">
          <span style="color:var(--danger)">⚠ 请求出错：</span>${escHtml(msg)}
        </div>
      </div>
    </div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

let thinkingCounter = 0;
function appendThinking() {
  const id = 'thinking-' + (++thinkingCounter);
  const chatArea = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'message-group';
  div.id = id;
  div.innerHTML = `
    <div class="message-row">
      <div class="avatar ai-av"><img src="/avatar.jpg" alt="AI"></div>
      <div class="bubble-wrap">
        <div class="thinking">
          <div class="thinking-dots">
            <div class="thinking-dot"></div>
            <div class="thinking-dot"></div>
            <div class="thinking-dot"></div>
          </div>
          <span class="thinking-text" id="${id}-text">正在分析问题...</span>
        </div>
        <div class="step-progress">
          <div class="step-item active" id="${id}-s1"><div class="step-dot"></div>Step 1 解析</div>
          <div class="step-arrow">→</div>
          <div class="step-item" id="${id}-s2"><div class="step-dot"></div>Step 2 推理</div>
          <div class="step-arrow">→</div>
          <div class="step-item" id="${id}-s3"><div class="step-dot"></div>Step 3 综合</div>
        </div>
      </div>
    </div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;

  // Animate step progress
  setTimeout(() => {
    const s1 = document.getElementById(`${id}-s1`);
    const s2 = document.getElementById(`${id}-s2`);
    const t  = document.getElementById(`${id}-text`);
    if (s1) s1.classList.replace('active', 'done');
    if (s2) s2.classList.add('active');
    if (t)  t.textContent = '知识库检索中...';
  }, 2500);
  setTimeout(() => {
    const s2 = document.getElementById(`${id}-s2`);
    const s3 = document.getElementById(`${id}-s3`);
    const t  = document.getElementById(`${id}-text`);
    if (s2) s2.classList.replace('active', 'done');
    if (s3) s3.classList.add('active');
    if (t)  t.textContent = '综合整合答案...';
  }, 6000);

  return id;
}
function removeThinking(id) {
  document.getElementById(id)?.remove();
}

// ═══════════════════════════════════════════════════════════════════
// RATING
// ═══════════════════════════════════════════════════════════════════
function handleRate(messageId, ratingVal) {
  state.pendingRating = { messageId, ratingVal };
  // Visual feedback immediately
  const likeBtn    = document.getElementById(`like-${messageId}`);
  const dislikeBtn = document.getElementById(`dislike-${messageId}`);
  if (likeBtn)    likeBtn.classList.toggle('liked',    ratingVal === 1);
  if (dislikeBtn) dislikeBtn.classList.toggle('disliked', ratingVal === -1);
  // Open feedback modal
  openFeedbackModal(ratingVal);
}

function openFeedbackModal(ratingVal) {
  const overlay = document.getElementById('feedback-modal-overlay');
  const title   = document.getElementById('feedback-modal-title');
  title.textContent = ratingVal === 1 ? '💬 感谢您的好评！有什么补充吗？' : '💬 感谢反馈！请告诉我们可以改进的地方';
  document.getElementById('feedback-textarea').value = '';
  overlay.classList.add('open');
}

async function submitFeedback(withText) {
  const overlay  = document.getElementById('feedback-modal-overlay');
  overlay.classList.remove('open');
  if (!state.pendingRating) return;

  const { messageId, ratingVal } = state.pendingRating;
  const feedback = withText ? document.getElementById('feedback-textarea').value.trim() : null;

  try {
    const res = await fetch(`${API}/api/rate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message_id: messageId, rating: ratingVal, feedback }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);

    // Show "recorded" label
    const ratedEl = document.getElementById(`rated-${messageId}`);
    if (ratedEl) ratedEl.style.display = 'inline';

    toast(ratingVal === 1 ? '👍 感谢您的点赞！' : '👎 反馈已记录，我们会持续改进', 'success');
    await loadStats();
  } catch (e) {
    toast('评价提交失败：' + e.message, 'error');
  }
  state.pendingRating = null;
}

// ═══════════════════════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════════════════════
async function loadStats() {
  try {
    const res = await fetch(API + '/api/stats');
    const data = await res.json();
    if (!data.ok) return;
    const s = data.stats;

    // Modal stats only (sidebar stats section removed)
    setText('m-sessions',  s.total_sessions  ?? '—');
    setText('m-questions', s.total_questions ?? '—');
    setText('m-rt', s.avg_response_time != null ? s.avg_response_time : '—');

    const likes    = s.total_likes    || 0;
    const dislikes = s.total_dislikes || 0;
    const total    = likes + dislikes || 1;
    document.getElementById('bar-like').style.width    = (likes    / total * 100) + '%';
    document.getElementById('bar-dislike').style.width = (dislikes / total * 100) + '%';
    setText('bar-like-count',    likes);
    setText('bar-dislike-count', dislikes);
  } catch {}
}

function openStatsModal() {
  loadStats();
  document.getElementById('stats-modal-overlay').classList.add('open');
}
function closeStatsModal(e) {
  if (!e || e.target === document.getElementById('stats-modal-overlay')) {
    document.getElementById('stats-modal-overlay').classList.remove('open');
  }
}

// Simple markdown renderer
function renderMarkdown(text) {
  if (!text) return '';
  let html = escHtml(text);
  // Headings
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Bold / italic
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // HR
  html = html.replace(/^---$/gm, '<hr>');
  // Blockquote
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Unordered list
  html = html.replace(/((?:^[•\-\*] .+\n?)+)/gm, (m) => {
    const items = m.trim().split('\n').map(l => `<li>${l.replace(/^[•\-\*] /, '')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  // Ordered list
  html = html.replace(/((?:^\d+\. .+\n?)+)/gm, (m) => {
    const items = m.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });
  // Paragraphs (double newline)
  html = html.split(/\n{2,}/).map(p => {
    p = p.trim();
    if (!p) return '';
    if (/^<(h[1-3]|ul|ol|blockquote|hr|pre)/.test(p)) return p;
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).join('');
  return html;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function setText(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

function now() {
  return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  const today = new Date();
  if (dt.toDateString() === today.toDateString()) {
    return dt.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  }
  return dt.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
}

function toast(msg, type = 'success') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// DELETE SESSION
// ═══════════════════════════════════════════════════════════════════
function confirmDeleteSession(sessionId, title) {
  if (!confirm('确定删除会话「' + title + '」？\n此操作将删除该会话的全部消息记录，且不可恢复。')) return;
  doDeleteSession(sessionId);
}

async function doDeleteSession(sessionId) {
  try {
    const res = await fetch(API + '/api/sessions/' + sessionId, { method: 'DELETE' });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    toast('🗑 会话已删除', 'success');
    // If the deleted session was active, start a new chat
    if (state.sessionId === sessionId) {
      await newChat(true);
    } else {
      await loadSessions();
    }
    await loadStats();
  } catch (e) {
    toast('删除失败：' + e.message, 'error');
  }
}
